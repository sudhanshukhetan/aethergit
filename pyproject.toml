[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aethergit"
version = "0.1.0"
description = "Deterministic Architectural Memory Firewall for Open-Source Repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.39.0",
    "requests>=2.32.3",
]

[tool.vercel]
entrypoint = "app.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
