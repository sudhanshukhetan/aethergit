name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pytest requests streamlit

      - name: Run unit test suite
        run: |
          PYTHONPATH=. python -m pytest tests/ -v || PYTHONPATH=. python -m unittest discover tests -v

      - name: Verify CLI example validation
        run: |
          python -m src.cli --Verify-examples
